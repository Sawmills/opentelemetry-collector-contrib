component: exporter/loadbalancing
note: Bound central queue recovery and healthy ramp by the discovered LB peer share of backend capacity.
issues: []
subtext: |
  The optional central_queue.load_balancer_service discovers collector-scoped peers through Kubernetes EndpointSlices.
  Initial unknown or empty membership retains queued batches. Discovery failures restore configured replica behavior and count a bounded failure reason.
  Fresh converged shares retain the minimum-one progress allowance.
