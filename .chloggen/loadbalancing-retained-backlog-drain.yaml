subtext: |-
  Fresh windows without trace affinity can spill within the existing send and byte limits.
  Fail-open retries rotate eligible destinations after three failed attempts within the configured reroute cap.
  Retained age metadata stays bounded by live queue ownership.
  Backend outcomes include the telemetry signal so readiness can observe log delivery independently.
