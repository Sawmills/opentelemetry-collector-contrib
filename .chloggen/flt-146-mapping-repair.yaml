component: exporter/elasticsearch
note: Add an optional single-attempt mapping rejection repair that preserves the original value in a flat JSON-string field.
issues: []
subtext: |
  Disabled by default. Applies only to ECS logs after a confirmed mapping item-400.
  Existing failure counters remain unchanged; separate counters report original
  failures, attempted repairs, successful repairs, terminal unrepaired items and
  unconfirmed acceptance outcomes.
