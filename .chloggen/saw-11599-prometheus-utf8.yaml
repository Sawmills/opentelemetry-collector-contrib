subtext: The default escaping and suffix behavior is unchanged. NoTranslation requires a compatible receiver. The unsafe NoUTF8EscapingWithSuffixes strategy is rejected. The Sawmills fork permits UTF-8 names over remote write v1 for destinations such as Prometheus 3.5.
