type: elasticsearch
display_name: Elasticsearch Exporter

status:
  class: exporter
  stability:
    beta: [traces, logs]
    development: [metrics, profiles]
  distributions: [contrib]
  codeowners:
    active: [JaredTan95, carsonip, lahsivjar]

attributes:
  error.type:
    description: The type of error that occurred when processing the documents.
    type: string
  expected_type:
    description: The bounded destination mapping type class.
    type: string
    enum: [text, date, number, object, boolean, unknown]
  exporter:
    description: The configured Elasticsearch exporter identifier.
    type: string
  failure_store:
    description: The status of the failure store.
    type: string
    enum: [unknown, not_enabled, used, failed]
  field_class:
    description: The allowlisted field class reported by a mapping failure.
    type: string
    enum: [timestamp, at_timestamp, duration, level, error, message, errors_data, change, other, unknown]
  http.response.status_code:
    description: HTTP status code.
    type: int
  item_status_class:
    description: The bounded HTTP status class of a terminal failed bulk item.
    type: string
    enum: ["400", "409", "429", other_4xx, 5xx, other]
  outcome:
    description: The operation outcome.
    type: string
    enum: [success, failed_client, failed_server, timeout, too_many, failure_store, internal_server_error]
  source:
    description: The positively identified source of the rejected field, or unknown.
    type: string
    enum: [resource, scope, log, body, log_alias, generated, mixed, unknown]
  value_type:
    description: The bounded source value type, without reading its contents.
    type: string
    enum: [map, slice, string, int, double, bool, bytes, empty, derived, unknown]

telemetry:
  metrics:
    elasticsearch.bulk_requests.count:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Count of the completed bulk requests.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [outcome, http.response.status_code]
    elasticsearch.bulk_requests.latency:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Latency of Elasticsearch bulk operations in seconds.
      unit: s
      histogram:
        value_type: double
        bucket_boundaries: [0, 0.005, 0.010, 0.025, 0.050, 0.075, 0.100, 0.250, 0.500, 0.750, 1, 2.5, 5, 7.5, 10, 25, 50, 75, 100, 250, 500, 750, 1000, 2500, 5000, 7500, 10000]
      attributes: [outcome, http.response.status_code]
    elasticsearch.docs.failed:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Count of documents that failed to be accepted by an Elasticsearch destination.
      extended_documentation: |
        Counts each document rejected in a partially failed bulk request once.
        If a bulk request fails after the configured HTTP retries, counts all
        documents in that request once. HTTP retries are not counted separately.
        The cumulative sum is reported with the configured exporter identifier
        and resets when the exporter process restarts.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [exporter]
    elasticsearch.docs.failed_by_field:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Count of confirmed terminal failed bulk items by bounded field attribution.
      extended_documentation: |
        Counts each confirmed terminal failed bulk item once. Accepted items,
        intermediate document retries and unconfirmed request failures are excluded.
        Unknown attribution remains explicit; source and type are unknown after
        document retries whose retained positions cannot be proven.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [exporter, item_status_class, field_class, expected_type, value_type, source]
    elasticsearch.docs.processed:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Count of documents flushed to Elasticsearch.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [outcome, http.response.status_code, failure_store, error.type]
    elasticsearch.docs.received:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Count of Elasticsearch documents successfully received to be buffered.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    elasticsearch.docs.retried:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Count of document retries.
      extended_documentation: Only document level retries are captured, whole bulk request retries are not captured.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    elasticsearch.docs.retried_http_request:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Count of documents retried due to HTTP request-level failures.
      extended_documentation: |
            Counts documents that are retried because an entire bulk HTTP
            request failed with a retryable status code (as configured in
            `retry_on_status`) and was retried by the Elasticsearch client,
            up to the `max_retries` limit.

            In contrast, `elasticsearch.docs.retried` counts documents retried
            individually within otherwise successful bulk requests due to
            document-specific failures such as mapping conflicts.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [outcome, http.response.status_code]
    elasticsearch.flushed.bytes:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Number of bytes flushed by the indexer.
      unit: By
      sum:
        value_type: int
        monotonic: true
    elasticsearch.flushed.uncompressed_bytes:
      prefix: otelcol.
      stability: alpha
      enabled: true
      description: Number of uncompressed bytes flushed by the indexer.
      unit: By
      sum:
        value_type: int
        monotonic: true
    elasticsearch.mapping_repair.attempted:
      prefix: otelcol.
      stability: development
      enabled: true
      description: Count of confirmed rejected items submitted for one lossless mapping repair attempt.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [exporter]
    elasticsearch.mapping_repair.original_400:
      prefix: otelcol.
      stability: development
      enabled: true
      description: Count of original-pass item 400 responses with mapping repair enabled.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [exporter]
    elasticsearch.mapping_repair.succeeded:
      prefix: otelcol.
      stability: development
      enabled: true
      description: Count of repaired items positively confirmed indexed.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [exporter]
    elasticsearch.mapping_repair.terminal_unrepaired:
      prefix: otelcol.
      stability: development
      enabled: true
      description: Count of confirmed rejected items without confirmed acceptance after their optional repair attempt.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [exporter]
    elasticsearch.mapping_repair.unconfirmed:
      prefix: otelcol.
      stability: development
      enabled: true
      description: Count of bulk flush or pending retry outcomes whose acceptance could not be confirmed.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [exporter]

tests:
  config:
    endpoints: [http://localhost:9200]
    mapping:
      # Set mapping mode to otel, since the default ("none") does
      # not support all signals.
      mode: otel
