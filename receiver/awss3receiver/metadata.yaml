display_name: AWS S3 Receiver
type: awss3

status:
  class: receiver
  stability:
    alpha: [traces,metrics,logs]
  distributions: [contrib]
  codeowners:
    active: [atoulme, adcharre]
tests:
  config:
    starttime: "2024-01-31"
    endtime: "2024-02-03"
    s3downloader:
      s3_bucket: "my-bucket"

attributes:
  object_drop_reason:
    name_override: reason
    description: Why the S3 object content was dropped.
    type: string
    enum: [decompress_failed, decode_failed]
  sqs_message_drop_reason:
    name_override: reason
    description: Why the SQS message was deleted without reading an S3 object.
    type: string
    enum: [invalid_json, not_s3_notification, invalid_sns_message]

telemetry:
  metrics:
    receiver_awss3_objects_dropped:
      description: Number of S3 objects dropped because their content cannot be decompressed or decoded.
      stability: development
      unit: "{objects}"
      enabled: true
      sum:
        value_type: int
        monotonic: true
      attributes: [object_drop_reason]
    receiver_awss3_sqs_messages_dropped:
      description: Number of SQS messages deleted because they are not a readable S3 event notification.
      stability: development
      unit: "{messages}"
      enabled: true
      sum:
        value_type: int
        monotonic: true
      attributes: [sqs_message_drop_reason]
